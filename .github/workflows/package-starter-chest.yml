name: Package Ultimate Starter Chest

on:
  workflow_dispatch:
  push:
    paths:
      - "ultimate-starter-chest/**"
      - ".github/workflows/package-starter-chest.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ultimate-starter-chest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate manifest and package .hnmod
        run: |
          python -m py_compile tools/package.py
          python tools/package.py
          python - <<'PY'
          import json
          import zipfile
          from pathlib import Path

          artifact = Path("target/starter_chest-0.1.0.hnmod")
          with zipfile.ZipFile(artifact) as archive:
              names = set(archive.namelist())
              assert "horizon-native.json" in names
              assert "horizon-mixin.toml" in names
              assert "register.rs" in names
              assert "command.rs" in names
              manifest = json.loads(archive.read("horizon-native.json"))
              assert manifest["id"] == "starter_chest"
              assert manifest["game"] == "26.3"
              assert manifest["hooks"] == 9
          print(f"Validated {artifact} ({artifact.stat().st_size} bytes)")
          PY

      - name: Upload .hnmod artifact
        uses: actions/upload-artifact@v4
        with:
          name: starter_chest-0.1.0-hnmod
          path: ultimate-starter-chest/target/starter_chest-0.1.0.hnmod
          if-no-files-found: error
          retention-days: 30
